                <div class="bar-outer"><div class="bar-inner" style="width:{min(int(depcheck['critical']/100*100),100)}%;background:#8e0000"></div></div>
                <div style="display:flex;justify-content:space-between;font-size:11px;margin:5px 0 3px"><span style="color:#6c7280">High alerts</span><span style="color:#f4512c">{depcheck['high'] + zap['high']}</span></div>
                <div class="bar-outer"><div class="bar-inner" style="width:{min(int((depcheck['high']+zap['high'])/200*100),100)}%;background:#f4512c"></div></div>
