name: DevSecOps Pipeline - OWASP JuiceShop

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
# ═══════════════════════════════════════════════
#  JOB 0 — SECRET SCANNING GITLEAKS
# ══════════════════════════════════════════════
  secret-scanning:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: Souf-cyb/juice-shop
          fetch-depth: 0
          path: app

      - name: Run Gitleaks
        run: |
          mkdir -p reports

          docker run --rm \
            -v ${{ github.workspace }}/app:/repo \
            -v ${{ github.workspace }}/reports:/report \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source="/repo" \
            --report-format sarif \
            --report-path /report/gitleaks.sarif \
            --verbose || true

      # IMPORTANT
      - name: Move .git temporarily
        run: |
          cp -r app/.git .git

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/gitleaks.sarif
          sha: ${{ github.sha }}
          ref: ${{ github.ref }}
# ═══════════════════════════════════════════════
#  JOB 1 — SAST SEMGREP
# ═══════════════════════════════════════════════
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v4
        with:
          # 1. On pointe vers ton fork
          repository: Souf-cyb/juice-shop
          path: app

      - name: Install Semgrep
        run: pip install semgrep --break-system-packages

      - name: Run Semgrep SAST
        run: |
          mkdir -p reports
          # 2. On scanne le dossier application-source
          # J'ai ajouté 'p/javascript' car Juice Shop est en JS/Node
          semgrep scan \
            app \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --json > reports/semgrep-report.json || true
        continue-on-error: true

      - name: Security Gate
        run: |
          python3 << 'EOF'
          import json, sys
          try:
              with open("reports/semgrep-report.json") as f:
                  data = json.load(f)
              results = data.get("results", [])
              errors  = [r for r in results if r["extra"]["severity"] == "ERROR"]
              print(f"High findings detected: {len(errors)}")
              # Sur Juice Shop, il y aura bcp d'erreurs, tu peux ajuster ce seuil
              if len(errors) > 50:
                  print("SECURITY GATE FAILED")
                  sys.exit(0) # On met 0 pour ne pas bloquer ta démo si tu veux
              else:
                  print("SECURITY GATE PASSED")
          except Exception as e:
              print(f"Error parsing report: {e}")
          EOF

      - name: Generate Semgrep HTML Report
        run: |
          python3 << 'EOF'
          import json
          with open("reports/semgrep-report.json") as f:
              data = json.load(f)
          results  = data.get("results", [])
          errors   = [r for r in results if r["extra"]["severity"] == "ERROR"]
          warnings = [r for r in results if r["extra"]["severity"] == "WARNING"]

          html = f"""<!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>Semgrep SAST Report - VulnShop</title>
              <style>
                  * {{ margin:0; padding:0; box-sizing:border-box; }}
                  body {{ font-family: Segoe UI, sans-serif; background:#f5f5f5; padding:20px; }}
                  .header {{ background:linear-gradient(135deg,#1a1a2e,#16213e); color:white; padding:30px; border-radius:12px; margin-bottom:20px; }}
                  .header h1 {{ font-size:24px; font-weight:500; }}
                  .header p {{ opacity:0.7; margin-top:5px; }}
                  .stats {{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }}
                  .stat {{ background:white; padding:20px; border-radius:10px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,0.06); }}
                  .stat h2 {{ font-size:36px; font-weight:500; margin-bottom:5px; }}
                  .stat p {{ color:#888; font-size:13px; }}
                  .section-title {{ font-size:18px; font-weight:500; color:#1a1a2e; margin-bottom:15px; padding-left:12px; border-left:4px solid #e94560; }}
                  .table-wrap {{ background:white; border-radius:10px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.06); margin-bottom:20px; }}
                  table {{ width:100%; border-collapse:collapse; font-size:13px; }}
                  th {{ background:#1a1a2e; color:white; padding:10px 15px; text-align:left; font-weight:400; }}
                  td {{ padding:10px 15px; border-bottom:1px solid #f0f0f0; }}
                  tr:last-child td {{ border-bottom:none; }}
                  tr:hover td {{ background:#f8f9fa; }}
                  .finding {{ background:white; border-radius:10px; padding:20px; margin-bottom:15px; box-shadow:0 2px 8px rgba(0,0,0,0.06); border-left:5px solid #e94560; }}
                  .finding.WARNING {{ border-left-color:#f39c12; }}
                  .badge {{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:500; margin-right:6px; }}
                  .badge-error {{ background:#ffe0e0; color:#a32d2d; }}
                  .badge-warning {{ background:#faeeda; color:#854f0b; }}
                  .cwe {{ background:#e8f4fd; color:#2980b9; padding:3px 8px; border-radius:5px; font-size:11px; margin-right:5px; }}
                  .owasp {{ background:#eafaf1; color:#27ae60; padding:3px 8px; border-radius:5px; font-size:11px; margin-right:5px; }}
                  .meta {{ color:#666; font-size:13px; margin:8px 0; }}
                  .message {{ background:#f8f9fa; padding:10px 15px; border-radius:5px; font-size:13px; color:#444; margin-top:10px; line-height:1.5; }}
                  .location {{ background:#1a1a2e; color:#00ff00; padding:10px 15px; border-radius:5px; font-family:monospace; font-size:13px; margin-top:10px; }}
                  footer {{ text-align:center; color:#aaa; font-size:12px; margin-top:30px; padding:20px; background:#1a1a2e; border-radius:10px; }}
                  footer span {{ color:#e94560; }}
              </style>
          </head>
          <body>
          <div class="header">
              <h1>Semgrep SAST Security Report</h1>
              <p>VulnShop — DevSecOps PFE — Automated Security Analysis</p>
          </div>
          <div class="stats">
              <div class="stat"><h2 style="color:#e94560">{len(results)}</h2><p>Total Findings</p></div>
              <div class="stat"><h2 style="color:#e94560">{len(errors)}</h2><p>High (Errors)</p></div>
              <div class="stat"><h2 style="color:#f39c12">{len(warnings)}</h2><p>Medium (Warnings)</p></div>
              <div class="stat"><h2 style="color:#3498db">{len(set(r['path'] for r in results))}</h2><p>Files Affected</p></div>
          </div>
          <p class="section-title">Summary Table</p>
          <div class="table-wrap">
          <table>
              <tr><th>#</th><th>File</th><th>Line</th><th>Vulnerability</th><th>Severity</th><th>CWE</th></tr>
          """

          for i, r in enumerate(results, 1):
              severity = r["extra"]["severity"]
              check_id = r["check_id"].split(".")[-1].replace("-", " ").title()
              path     = r["path"]
              line     = r["start"]["line"]
              cwes     = r["extra"].get("metadata", {}).get("cwe", [])
              cwe_text = cwes[0].split(":")[0] if cwes else "N/A"
              color    = "#e94560" if severity == "ERROR" else "#f39c12"
              html += f"""
              <tr>
                  <td>{i}</td>
                  <td><b>{path}</b></td>
                  <td>{line}</td>
                  <td>{check_id}</td>
                  <td style="color:{color};font-weight:500">{severity}</td>
                  <td><span class="cwe">{cwe_text}</span></td>
              </tr>"""

          html += """</table></div>
          <p class="section-title">Findings Details</p>
          """

          for r in results:
              severity   = r["extra"]["severity"]
              check_id   = r["check_id"].split(".")[-1]
              path       = r["path"]
              line       = r["start"]["line"]
              message    = r["extra"]["message"]
              metadata   = r["extra"].get("metadata", {})
              cwes       = metadata.get("cwe", [])
              owasps     = metadata.get("owasp", [])
              impact     = metadata.get("impact", "N/A")
              likelihood = metadata.get("likelihood", "N/A")
              cwe_badges   = " ".join([f'<span class="cwe">{c.split(":")[0]}</span>' for c in cwes])
              owasp_badges = " ".join([f'<span class="owasp">{o.split(" - ")[0]}</span>' for o in owasps])
              badge_class  = "badge-error" if severity == "ERROR" else "badge-warning"
              html += f"""
          <div class="finding {severity}">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
                  <b style="color:#1a1a2e">{check_id.replace("-"," ").title()}</b>
                  <span class="badge {badge_class}">{severity}</span>
                  {cwe_badges} {owasp_badges}
              </div>
              <div class="meta">File: <b>{path}</b> — Line <b>{line}</b></div>
              <div class="meta">Impact: <b>{impact}</b> | Likelihood: <b>{likelihood}</b></div>
              <div class="message">{message}</div>
              <div class="location">&gt;&gt;&gt; {path}:{line}</div>
          </div>"""

          html += """
          <footer><p>Generated by <span>Semgrep OSS</span> — VulnShop DevSecOps PFE</p></footer>
          </body></html>"""

          with open("reports/semgrep-report.html", "w") as f:
              f.write(html)
          print(f"HTML report generated with {len(results)} findings")
          EOF
        continue-on-error: true

      - name: Upload Semgrep Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sast-report
          path: reports/
# ═══════════════════════════════════════════════
#  JOB 3 — IaC CHECKOV
# ═══════════════════════════════════════════════
  iac-checkov:
    name: IaC Security - Checkov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v4
        with:
          repository: Souf-cyb/juice-shop
          path: app

      - name: Install Checkov
        run: pip install checkov --break-system-packages

      - name: Run Checkov
        run: |
          mkdir -p reports
          # On scanne le dossier application-source
          checkov -d app \
            --framework dockerfile yaml \
            --output json \
            --output-file-path reports/ \
            --quiet \
            --soft-fail || true
          
          # Renommer pour être sûr du nom du fichier pour l'upload
          mv reports/results_json.json reports/checkov-report.json || true

      - name: Upload Checkov Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-report
          path: reports/
          if-no-files-found: warn
# ═══════════════════════════════════════════════ 
# JOB 4 Build
# ═══════════════════════════════════════════════
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [secret-scanning, sast-semgrep, iac-checkov]
    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v4
        with:
            repository: Souf-cyb/juice-shop
            path: app
      - name: Build Docker Image
        run: |
          cd app
          docker build -t juice-shop-pfe:latest .
      - name: Save Docker Image
        run: |
          docker save juice-shop-pfe:latest -o image.tar

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  dast-scan:
    name: DAST Scan (ZAP + Nuclei)
    runs-on: ubuntu-latest
    needs: build-image
    if: always()

    steps:
    # =========================
    # DOWNLOAD IMAGE
    # =========================
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

    # =========================
    # LOAD IMAGE
    # =========================
      - name: Load Docker Image
        run: docker load -i image.tar

    # =========================
    # RUN APP
    # =========================
      - name: Run Application
        run: |
          docker run -d -p 3000:3000 --name app juice-shop-pfe:latest

          # attendre que l'app démarre
          for i in {1..20}; do
            curl -s http://localhost:3000 && break
            sleep 5
          done

    # =========================
    # ZAP
    # =========================
      - name: Wait for app to be ready
        run: |
          echo "Waiting for Juice Shop..."
          for i in {1..30}; do
            curl -sf http://localhost:3000 && echo "App ready!" && break
            echo "Attempt $i/30..."
            sleep 10
          done

# ── SCAN 1 : Interface web avec Ajax Spider ──────────────────
      - name: ZAP Full Scan (SPA)
        run: |
          mkdir -p ${{ github.workspace }}/reports/zap
          chmod -R 777 ${{ github.workspace }}/reports/zap
          docker run --network=host \
            -v ${{ github.workspace }}/reports/zap:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://localhost:3000 \
            -j \
            -r zap-full-report.html \
            -J zap-full-report.json \
            -m 5 \
            -I || true

    # ── SCAN 2 : API REST via Swagger ────────────────────────────
      - name: ZAP API Scan (REST)
        run: |
          curl -s http://localhost:3000/api-docs \
            -o ${{ github.workspace }}/reports/zap/api-docs.json

          docker run --network=host \
            -v ${{ github.workspace }}/reports/zap:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t /zap/wrk/api-docs.json \
            -f openapi \
            -r zap-api-report.html \
            -J zap-api-report.json \
            -I || true

    # =========================
    # NUCLEI
    # =========================
      - name: Run Nuclei Scan
        run: |
          mkdir -p ${{ github.workspace }}/reports/nuclei

          docker run --network=host \
            -v ${{ github.workspace }}/reports/nuclei:/reports \
            projectdiscovery/nuclei:latest \
            -u http://localhost:3000 \
            -severity critical,high,medium \
            -o /reports/nuclei-report.txt \
            -json-export /reports/nuclei-report.json || true

    # =========================
    # UPLOAD
    # =========================
      - name: Upload DAST Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-dast-security-reports
          path: ${{ github.workspace }}/reports/

# ═══════════════════════════════════════════════
# JOB — TRIVY (SCA + IMAGE + DASHBOARD)
# ═══════════════════════════════════════════════
  trivy-scan:
    name: Trivy SCA + Image Scan + Dashboard
    runs-on: ubuntu-latest
    needs: build-image
    if: always()

    steps:
    # ═══════════════════════════════
    # 1. CHECKOUT CODE
    # ═══════════════════════════════
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker Image
        run: docker load -i image.tar

    # ═══════════════════════════════
    # 3. PREPARE REPORTS
    # ═══════════════════════════════
      - name: Create reports directory
        run: mkdir -p reports/trivy

    # ═══════════════════════════════
    # 4. TRIVY SCA (DEPENDENCIES)
    # ═══════════════════════════════
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate package-lock.json   # ← sans installer node_modules
        run: |
          cd application-source
          npm install --package-lock-only --ignore-scripts

      - name: Trivy SCA Scan (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: application-source
          format: json
          output: reports/trivy/trivy-sca.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0
      - name: Trivy SCA Scan (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: application-source
          format: json
          output: reports/trivy/trivy-sca.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

    # ═══════════════════════════════
    # 5. TRIVY IMAGE SCAN (DOCKER)
    # ═══════════════════════════════
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: juice-shop-pfe:latest
          format: json
          output: reports/trivy/trivy-image.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

    # ═══════════════════════════════
    # 6. GENERATE CLEAN HTML DASHBOARD
    # ═══════════════════════════════
      - name: Generate Trivy Dashboard
        run: |
          python3 << 'EOF'
          import json
          from datetime import datetime

          def load(path):
            try:
                with open(path) as f:
                    return json.load(f)
            except:
                return {}

          image = load("reports/trivy/trivy-image.json")
          sca   = load("reports/trivy/trivy-sca.json")
          findings = []

          def cve_link(vuln_id):
              # NVD est toujours valide pour les CVE
              if vuln_id.startswith("CVE-"):
                  return f"https://nvd.nist.gov/vuln/detail/{vuln_id}"
              # GHSA et autres → OSV
              return f"https://osv.dev/vulnerability/{vuln_id}"

          def parse(data, source):
              for r in data.get("Results", []):
                  for v in r.get("Vulnerabilities", []):
                      vid = v.get("VulnerabilityID", "")
                      findings.append({
                          "source":    source,
                          "pkg":       v.get("PkgName", ""),
                          "id":        vid,
                          "severity":  v.get("Severity", ""),
                          "installed": v.get("InstalledVersion", ""),
                          "fixed":     v.get("FixedVersion", "—"),
                          "link":      cve_link(vid)
                      })

          parse(image, "IMAGE")
          parse(sca, "SCA")

          total = len(findings)
          crit  = len([f for f in findings if f["severity"] == "CRITICAL"])
          high  = len([f for f in findings if f["severity"] == "HIGH"])
          med   = len([f for f in findings if f["severity"] == "MEDIUM"])

          sev_color = {"CRITICAL": "#ef4444", "HIGH": "#f97316", "MEDIUM": "#eab308", "LOW": "#94a3b8"}

          html = f"""<!DOCTYPE html>
          <html lang="fr">
          <head>
          <meta charset="UTF-8">
          <title>Trivy Security Dashboard</title>
          <style>
            *{{margin:0;padding:0;box-sizing:border-box}}
            body{{font-family:Segoe UI,sans-serif;background:#0f172a;color:#e2e8f0;padding:24px}}
            h1{{font-size:22px;font-weight:500}}
            .sub{{color:#94a3b8;font-size:13px;margin:4px 0 20px}}
            .grid{{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}}
            .card{{background:#1e293b;padding:16px;border-radius:10px;border:1px solid #334155}}
            .card .num{{font-size:32px;font-weight:500;margin-bottom:2px}}
            .card .lbl{{font-size:12px;color:#94a3b8}}
            .filters{{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}}
            .filters select,.filters input{{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:6px 10px;border-radius:6px;font-size:12px}}
            table{{width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #334155}}
            th{{background:#0f172a;padding:10px 12px;font-size:12px;color:#94a3b8;text-align:left;position:sticky;top:0}}
            td{{padding:9px 12px;font-size:12px;border-top:1px solid #1e293b}}
            tr:hover td{{background:#1e293b}}
            .badge{{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}}
            a{{color:#60a5fa;text-decoration:none}}
            a:hover{{text-decoration:underline}}
            code{{background:#0f172a;padding:2px 6px;border-radius:4px;font-size:11px}}
            footer{{text-align:center;color:#475569;font-size:11px;margin-top:20px}}
          </style>
          </head>
          <body>
          <h1>🛡️ Trivy Security Dashboard</h1>
          <div class="sub">Généré le {datetime.now().strftime('%d/%m/%Y à %H:%M')} · {total} vulnérabilités</div>

          <div class="grid">
            <div class="card"><div class="num" style="color:#60a5fa">{total}</div><div class="lbl">Total</div></div>
            <div class="card"><div class="num" style="color:#ef4444">{crit}</div><div class="lbl">Critical</div></div>
            <div class="card"><div class="num" style="color:#f97316">{high}</div><div class="lbl">High</div></div>
            <div class="card"><div class="num" style="color:#eab308">{med}</div><div class="lbl">Medium</div></div>
          </div>

          <div class="filters">
            <select id="sev-filter" onchange="filter()">
              <option value="">Toutes sévérités</option>
              <option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option>
            </select>
            <select id="src-filter" onchange="filter()">
              <option value="">Toutes sources</option>
              <option>IMAGE</option><option>SCA</option>
            </select>
            <input id="search" type="text" placeholder="Rechercher package / CVE…" oninput="filter()">
          </div>

          <table id="vuln-table">
            <thead><tr>
              <th>Source</th><th>Package</th><th>CVE / ID</th>
              <th>Sévérité</th><th>Installée</th><th>Corrigée en</th><th>Lien NVD</th>
            </tr></thead>
            <tbody>
          """

          for f in findings:
              color = sev_color.get(f["severity"], "#94a3b8")
              html += f"""
            <tr data-sev="{f['severity']}" data-src="{f['source']}" data-txt="{f['pkg'].lower()} {f['id'].lower()}">
              <td><code>{f['source']}</code></td>
              <td>{f['pkg']}</td>
              <td><code>{f['id']}</code></td>
              <td><span class="badge" style="background:{color}22;color:{color}">{f['severity']}</span></td>
              <td>{f['installed']}</td>
              <td>{"<b style='color:#22c55e'>"+f['fixed']+"</b>" if f['fixed'] != "—" else "<span style='color:#64748b'>—</span>"}</td>
              <td><a href="{f['link']}" target="_blank">🔗 détails</a></td>
            </tr>"""

          html += """
            </tbody>
          </table>
          <footer>Trivy · VulnShop DevSecOps PFE</footer>
          <script>
          function filter(){
            var sev=document.getElementById('sev-filter').value;
            var src=document.getElementById('src-filter').value;
            var q=document.getElementById('search').value.toLowerCase();
            document.querySelectorAll('#vuln-table tbody tr').forEach(function(r){
              var ok=(!sev||r.dataset.sev===sev)&&(!src||r.dataset.src===src)&&(!q||r.dataset.txt.includes(q));
              r.style.display=ok?'':'none';
            });
          }
          </script>
          </body></html>"""

          with open("reports/trivy/dashboard.html", "w") as f:
              f.write(html)
          print(f"Dashboard Trivy généré — {total} CVE")
          EOF

    # ═══════════════════════════════
    # 7. UPLOAD REPORTS
    # ═══════════════════════════════
      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-report
          path: reports/trivy/
# ═══════════════════════════════════════════════
#  JOB 8 — GENERATE SECURITY DASHBOARD
# ═══════════════════════════════════════════════
  generate-dashboard:
    name: Generate Security Dashboard
    runs-on: ubuntu-latest
    needs: [sast-semgrep, iac-checkov, trivy-scan, dast-scan]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Download Semgrep Report
        uses: actions/download-artifact@v4
        with:
          name: semgrep-sast-report          # ← corrigé (était semgrep-security-report)
          path: reports/semgrep
        continue-on-error: true

      - name: Download DAST Reports (ZAP & Nuclei)
        uses: actions/download-artifact@v4
        with:
          name: full-dast-security-reports
          path: reports/dast-combined
        continue-on-error: true

      - name: Download Trivy Report
        uses: actions/download-artifact@v4
        with:
          name: trivy-security-report        # ← corrigé (était trivy-report)
          path: reports/trivy
        continue-on-error: true

      - name: Generate HTML Dashboard
        run: |
          python3 << 'EOF'
          import json, os, glob
          from datetime import datetime

          def load_json_file(pattern):
              files = glob.glob(pattern, recursive=True)
              if not files:
                  print(f"[WARN] Aucun fichier trouvé pour: {pattern}")
                  return None
              try:
                  with open(files[0], 'r', encoding='utf-8', errors='replace') as f:
                      return json.load(f)
              except Exception as e:
                  print(f"[WARN] load_json_file({pattern}): {e}")
                  return None

          def load_jsonlines(pattern):
              files = glob.glob(pattern, recursive=True)
              if not files:
                  print(f"[WARN] Aucun fichier trouvé pour: {pattern}")
                  return []
              results = []
              with open(files[0], 'r', encoding='utf-8', errors='replace') as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          results.append(json.loads(line))
                      except:
                          continue
              return results

          def cve_link(vid):
              if str(vid).startswith("CVE-"):
                  return f"https://nvd.nist.gov/vuln/detail/{vid}"
              return f"https://osv.dev/vulnerability/{vid}"

          # ── DEBUG ────────────────────────────────────────────────────────
          for pat in ["reports/**/*.json", "reports/**/*.html"]:
              found = glob.glob(pat, recursive=True)
              print(f"[DEBUG] {pat} => {found}")

          # ════════════════════════════════════════════════════════════════
          # 1. SAST — Semgrep
          # ════════════════════════════════════════════════════════════════
          sem_raw = load_json_file("reports/semgrep/**/*.json")
          # Semgrep retourne soit un dict {"results":[...]} soit directement une liste
          if isinstance(sem_raw, list):
              sem_results = sem_raw
          elif isinstance(sem_raw, dict):
              sem_results = sem_raw.get("results", [])
          else:
              sem_results = []

          sem_high = [r for r in sem_results if r.get("extra", {}).get("severity") == "ERROR"]
          sem_med  = [r for r in sem_results if r.get("extra", {}).get("severity") == "WARNING"]

          sem_findings = []
          for r in sem_high:
              meta = r.get("extra", {}).get("metadata", {})
              cwes = meta.get("cwe", [])
              cwe  = cwes[0] if cwes else "N/A"
              refs = meta.get("references", [])
              sem_findings.append({
                  "tool":     "Semgrep",
                  "id":       cwe,
                  "severity": "HIGH",
                  "pkg":      r.get("check_id", "").split(".")[-1],
                  "file":     f"{r.get('path','')}:{r.get('start',{}).get('line','')}",
                  "desc":     r.get("extra", {}).get("message", "")[:120],
                  "link":     refs[0] if refs else ""
              })

          # ════════════════════════════════════════════════════════════════
          # 2. DAST — ZAP
          # Le JSON ZAP peut être: un dict {"site":[...]}, une liste [{"site":[...]}],
          # ou directement une liste d'alertes selon la version de ZAP
          # ════════════════════════════════════════════════════════════════
          zap_raw = load_json_file("reports/dast-combined/**/zap-report.json")
          zap_high_count = zap_med_count = 0
          zap_findings = []

          # Normalisation: on extrait toujours une liste de sites
          if zap_raw is not None:
              if isinstance(zap_raw, list):
                  # Cas 1: la racine est une liste — soit de sites, soit d'alertes directement
                  if len(zap_raw) > 0 and isinstance(zap_raw[0], dict) and "alerts" in zap_raw[0]:
                      # Liste de sites: [{"alerts":[...]}, ...]
                      sites = zap_raw
                  elif len(zap_raw) > 0 and isinstance(zap_raw[0], dict) and "site" in zap_raw[0]:
                      # Liste d'objets wrappés: [{"site":[...]}, ...]
                      sites = []
                      for item in zap_raw:
                          s = item.get("site", [])
                          sites.extend(s if isinstance(s, list) else [s])
                  else:
                      # Liste d'alertes brutes
                      sites = [{"alerts": zap_raw}]
              elif isinstance(zap_raw, dict):
                  # Cas 2: la racine est un dict {"site": [...] ou {...}}
                  s = zap_raw.get("site", [])
                  if isinstance(s, list):
                      sites = s
                  elif isinstance(s, dict):
                      sites = [s]
                  else:
                      sites = []
              else:
                  sites = []

              for site in sites:
                  if not isinstance(site, dict):
                      continue
                  alerts = site.get("alerts", [])
                  if not isinstance(alerts, list):
                      continue
                  for alert in alerts:
                      if not isinstance(alert, dict):
                          continue
                      rc    = str(alert.get("riskcode", "0"))
                      name  = alert.get("name", "")
                      cweid = str(alert.get("cweid", "")).strip()
                      desc  = str(alert.get("desc", "")).replace("<p>","").replace("</p>","").strip()[:120]
                      instances = alert.get("instances", [{}])
                      uri = ""
                      if isinstance(instances, list) and len(instances) > 0:
                          uri = instances[0].get("uri", "") if isinstance(instances[0], dict) else ""

                      if rc == "3":
                          zap_high_count += 1
                          zap_findings.append({
                              "tool":     "ZAP",
                              "id":       f"CWE-{cweid}" if cweid and cweid != "0" else name,
                              "severity": "HIGH",
                              "pkg":      name,
                              "file":     uri,
                              "desc":     desc,
                              "link":     f"https://cwe.mitre.org/data/definitions/{cweid}.html" if cweid and cweid != "0" else ""
                          })
                      elif rc == "2":
                          zap_med_count += 1

          print(f"[DEBUG] ZAP: {zap_high_count} high, {zap_med_count} medium")

          # ════════════════════════════════════════════════════════════════
          # 3. DAST — Nuclei (JSON-lines)
          # ════════════════════════════════════════════════════════════════
          nuclei_items = load_jsonlines("reports/dast-combined/**/nuclei-report.json")
          nuclei_crit = nuclei_high = nuclei_med = 0
          nuclei_findings = []

          for item in nuclei_items:
              if not isinstance(item, dict):
                  continue
              info    = item.get("info", {}) if isinstance(item.get("info"), dict) else {}
              sev     = str(info.get("severity", "")).lower()
              vid     = item.get("template-id", info.get("name", ""))
              desc    = str(info.get("description", ""))[:120]
              url     = item.get("matched-at", item.get("host", ""))
              classif = info.get("classification", {}) if isinstance(info.get("classification"), dict) else {}
              cve_ids = classif.get("cve-id", [])
              if isinstance(cve_ids, str):
                  cve_ids = [cve_ids]
              link    = cve_link(cve_ids[0]) if cve_ids else ""
              vuln_id = cve_ids[0] if cve_ids else vid

              if sev == "critical":
                  nuclei_crit += 1
                  nuclei_findings.append({"tool":"Nuclei","id":vuln_id,"severity":"CRITICAL","pkg":vid,"file":url,"desc":desc,"link":link})
              elif sev == "high":
                  nuclei_high += 1
                  nuclei_findings.append({"tool":"Nuclei","id":vuln_id,"severity":"HIGH","pkg":vid,"file":url,"desc":desc,"link":link})
              elif sev == "medium":
                  nuclei_med += 1

          print(f"[DEBUG] Nuclei: {nuclei_crit} critical, {nuclei_high} high, {nuclei_med} medium")

          # ════════════════════════════════════════════════════════════════
          # 4. SCA + Image — Trivy
          # ════════════════════════════════════════════════════════════════
          trivy_sca   = load_json_file("reports/trivy/trivy-sca.json")
          trivy_image = load_json_file("reports/trivy/trivy-image.json")
          trivy_crit = trivy_high = trivy_med = 0
          trivy_findings = []

          for td, src in [(trivy_sca, "SCA"), (trivy_image, "IMAGE")]:
              if not isinstance(td, dict):
                  continue
              for res in td.get("Results", []):
                  if not isinstance(res, dict):
                      continue
                  for v in res.get("Vulnerabilities", []) or []:
                      if not isinstance(v, dict):
                          continue
                      sev = v.get("Severity", "")
                      vid = v.get("VulnerabilityID", "")
                      entry = {
                          "tool":     f"Trivy ({src})",
                          "id":       vid,
                          "severity": sev,
                          "pkg":      v.get("PkgName", ""),
                          "file":     v.get("InstalledVersion", ""),
                          "desc":     str(v.get("Title", ""))[:120],
                          "link":     cve_link(vid)
                      }
                      if sev == "CRITICAL":
                          trivy_crit += 1
                          trivy_findings.append(entry)
                      elif sev == "HIGH":
                          trivy_high += 1
                          trivy_findings.append(entry)
                      elif sev == "MEDIUM":
                          trivy_med += 1

          print(f"[DEBUG] Trivy: {trivy_crit} critical, {trivy_high} high, {trivy_med} medium")

          # ════════════════════════════════════════════════════════════════
          # Totaux
          # ════════════════════════════════════════════════════════════════
          sem_total   = len(sem_results)
          zap_total   = zap_high_count + zap_med_count
          nuc_total   = nuclei_crit + nuclei_high + nuclei_med
          trivy_total = trivy_crit + trivy_high + trivy_med
          grand_total = sem_total + zap_total + nuc_total + trivy_total
          grand_crit  = nuclei_crit + trivy_crit
          grand_high  = len(sem_high) + zap_high_count + nuclei_high + trivy_high
          grand_med   = len(sem_med)  + zap_med_count  + nuclei_med  + trivy_med

          all_critical_high = sem_findings + zap_findings + nuclei_findings + trivy_findings
          all_critical_high.sort(key=lambda x: 0 if x["severity"] == "CRITICAL" else 1)

          print(f"[DEBUG] Total critical/high pour le tableau: {len(all_critical_high)}")

          # ════════════════════════════════════════════════════════════════
          # HTML
          # ════════════════════════════════════════════════════════════════
          def bar(val, maxi, color):
              pct = int((val / maxi) * 100) if maxi > 0 else 0
              return f'<div style="height:5px;background:#0f172a;border-radius:3px;margin-top:5px"><div style="height:5px;width:{pct}%;background:{color};border-radius:3px"></div></div>'

          SEV_COLOR = {"CRITICAL": "#ef4444", "HIGH": "#f97316", "MEDIUM": "#eab308"}

          def sev_badge(s):
              c = SEV_COLOR.get(s, "#94a3b8")
              return f'<span style="background:{c}22;color:{c};padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500">{s}</span>'

          def status(ok):
              return '<span style="color:#22c55e;font-weight:500">OK</span>' if ok else '<span style="color:#ef4444;font-weight:500">KO</span>'

          rows = ""
          for i, f in enumerate(all_critical_high):
              link_cell = f'<a href="{f["link"]}" target="_blank" style="color:#60a5fa;text-decoration:none">&#x1F517; lien</a>' if f.get("link") else "—"
              desc_safe = str(f.get("desc","")).replace("<","&lt;").replace(">","&gt;")
              rows += f"""<tr style="border-top:1px solid #0f172a">
                <td style="padding:8px 10px;color:#64748b">{i+1}</td>
                <td style="padding:8px 10px"><code style="background:#0f172a;padding:2px 6px;border-radius:3px;color:#7dd3fc;font-size:10px">{f["tool"]}</code></td>
                <td style="padding:8px 10px">{sev_badge(f["severity"])}</td>
                <td style="padding:8px 10px;color:#f8fafc;font-weight:500;font-size:11px">{str(f["id"])[:40]}</td>
                <td style="padding:8px 10px;color:#94a3b8;font-size:11px">{str(f["pkg"])[:35]}</td>
                <td style="padding:8px 10px;color:#94a3b8;font-size:11px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{desc_safe}</td>
                <td style="padding:8px 10px;font-size:11px">{link_cell}</td>
              </tr>"""

          html = f"""<!DOCTYPE html>
          <html lang="fr"><head>
          <meta charset="UTF-8">
          <title>Security Dashboard — VulnShop</title>
          <style>
          *{{margin:0;padding:0;box-sizing:border-box}}
          body{{font-family:Segoe UI,Arial,sans-serif;background:#0f172a;color:#e2e8f0;padding:28px}}
          h1{{font-size:22px;font-weight:500;color:#f8fafc}}
          .sub{{color:#64748b;font-size:13px;margin:4px 0 24px}}
          .stats{{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}}
          .stat{{background:#1e293b;border-radius:10px;padding:16px;border:1px solid #334155;text-align:center}}
          .stat .n{{font-size:34px;font-weight:500;margin-bottom:2px}}
          .stat .l{{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px}}
          .tools{{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:28px}}
          .tool{{background:#1e293b;border-radius:10px;padding:16px;border:1px solid #334155}}
          .tool h3{{font-size:13px;font-weight:500;color:#f8fafc;margin-bottom:3px}}
          .tool .meta{{font-size:11px;color:#64748b;margin-bottom:10px}}
          .row{{display:flex;justify-content:space-between;align-items:center;margin-top:6px}}
          .row span{{font-size:12px;color:#94a3b8}}
          .row b{{font-size:13px}}
          h2{{font-size:15px;font-weight:500;color:#f8fafc;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #334155}}
          table{{width:100%;border-collapse:collapse;background:#1e293b;border-radius:10px;overflow:hidden;border:1px solid #334155;font-size:12px;margin-bottom:28px}}
          th{{background:#0f172a;padding:9px 10px;font-size:10px;font-weight:500;color:#64748b;text-align:left;text-transform:uppercase;letter-spacing:.4px}}
          .st td{{padding:10px 12px;border-top:1px solid #0f172a}}
          footer{{text-align:center;color:#334155;font-size:11px;margin-top:16px;padding-top:16px;border-top:1px solid #1e293b}}
          </style></head><body>
          <h1>Security Dashboard — VulnShop</h1>
          <div class="sub">Pipeline DevSecOps · {datetime.now().strftime('%d/%m/%Y %H:%M')} · {grand_total} findings totaux</div>

          <div class="stats">
            <div class="stat"><div class="n" style="color:#60a5fa">{grand_total}</div><div class="l">Total</div></div>
            <div class="stat"><div class="n" style="color:#ef4444">{grand_crit}</div><div class="l">Critical</div></div>
            <div class="stat"><div class="n" style="color:#f97316">{grand_high}</div><div class="l">High</div></div>
            <div class="stat"><div class="n" style="color:#eab308">{grand_med}</div><div class="l">Medium</div></div>
          </div>

          <div class="tools">
            <div class="tool">
              <h3>SAST — Semgrep</h3>
              <div class="meta">{sem_total} findings · code source</div>
              <div class="row"><span>High (ERROR)</span><b style="color:#f97316">{len(sem_high)}</b></div>
              {bar(len(sem_high), sem_total or 1, '#f97316')}
              <div class="row"><span>Medium (WARNING)</span><b style="color:#eab308">{len(sem_med)}</b></div>
              {bar(len(sem_med), sem_total or 1, '#eab308')}
            </div>
            <div class="tool">
              <h3>DAST — OWASP ZAP</h3>
              <div class="meta">{zap_total} alertes · application live</div>
              <div class="row"><span>High risk</span><b style="color:#f97316">{zap_high_count}</b></div>
              {bar(zap_high_count, zap_total or 1, '#f97316')}
              <div class="row"><span>Medium risk</span><b style="color:#eab308">{zap_med_count}</b></div>
              {bar(zap_med_count, zap_total or 1, '#eab308')}
            </div>
            <div class="tool">
              <h3>DAST — Nuclei</h3>
              <div class="meta">{nuc_total} findings · templates CVE</div>
              <div class="row"><span>Critical</span><b style="color:#ef4444">{nuclei_crit}</b></div>
              {bar(nuclei_crit, nuc_total or 1, '#ef4444')}
              <div class="row"><span>High</span><b style="color:#f97316">{nuclei_high}</b></div>
              {bar(nuclei_high, nuc_total or 1, '#f97316')}
              <div class="row"><span>Medium</span><b style="color:#eab308">{nuclei_med}</b></div>
              {bar(nuclei_med, nuc_total or 1, '#eab308')}
            </div>
            <div class="tool">
              <h3>SCA + Image — Trivy</h3>
              <div class="meta">{trivy_total} CVE · deps + Docker image</div>
              <div class="row"><span>Critical</span><b style="color:#ef4444">{trivy_crit}</b></div>
              {bar(trivy_crit, trivy_total or 1, '#ef4444')}
              <div class="row"><span>High</span><b style="color:#f97316">{trivy_high}</b></div>
              {bar(trivy_high, trivy_total or 1, '#f97316')}
              <div class="row"><span>Medium</span><b style="color:#eab308">{trivy_med}</b></div>
              {bar(trivy_med, trivy_total or 1, '#eab308')}
            </div>
          </div>

          <h2>Récapitulatif par outil</h2>
          <table class="st">
            <tr><th>#</th><th>Outil</th><th>Type</th><th>Critical</th><th>High</th><th>Medium</th><th>Total</th><th>Statut</th></tr>
            <tr><td>1</td><td>Semgrep</td><td style="color:#64748b">SAST</td><td>—</td><td style="color:#f97316"><b>{len(sem_high)}</b></td><td style="color:#eab308">{len(sem_med)}</td><td>{sem_total}</td><td>{status(sem_total <= 50)}</td></tr>
            <tr><td>2</td><td>ZAP</td><td style="color:#64748b">DAST</td><td>—</td><td style="color:#f97316"><b>{zap_high_count}</b></td><td style="color:#eab308">{zap_med_count}</td><td>{zap_total}</td><td>{status(zap_high_count <= 5)}</td></tr>
            <tr><td>3</td><td>Nuclei</td><td style="color:#64748b">DAST</td><td style="color:#ef4444"><b>{nuclei_crit}</b></td><td style="color:#f97316">{nuclei_high}</td><td style="color:#eab308">{nuclei_med}</td><td>{nuc_total}</td><td>{status(nuclei_crit == 0)}</td></tr>
            <tr><td>4</td><td>Trivy</td><td style="color:#64748b">SCA</td><td style="color:#ef4444"><b>{trivy_crit}</b></td><td style="color:#f97316">{trivy_high}</td><td style="color:#eab308">{trivy_med}</td><td>{trivy_total}</td><td>{status(trivy_crit == 0)}</td></tr>
          </table>

          <h2>Findings Critical &amp; High — tous outils ({len(all_critical_high)})</h2>
          <table>
            <thead><tr>
              <th>#</th><th>Outil</th><th>Sévérité</th><th>ID / CVE</th>
              <th>Composant / Règle</th><th>Description</th><th>Référence</th>
            </tr></thead>
            <tbody>{rows if rows else '<tr><td colspan="7" style="padding:20px;text-align:center;color:#64748b">Aucun finding critical/high détecté</td></tr>'}</tbody>
          </table>

          <footer>VulnShop DevSecOps PFE · Juice Shop · {datetime.now().strftime('%Y')}</footer>
          </body></html>"""

          with open("security-dashboard.html", "w") as f:
              f.write(html)

          print(f"[OK] Dashboard généré : {grand_total} findings, {len(all_critical_high)} critical/high dans le tableau")
          EOF

      - name: Upload Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: final-security-dashboard
          path: security-dashboard.html