          .tools{{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}}
          .tool-card{{background:#1e293b;border-radius:10px;padding:14px;border:1px solid #334155}}
          .tool-card h3{{font-size:12px;font-weight:500;margin-bottom:3px;color:#f1f5f9}}
          .tool-card .meta{{font-size:10px;color:#64748b;margin-bottom:10px}}
          .row-stat{{display:flex;justify-content:space-between;margin-top:7px;align-items:center}}
