          .filters select,.filters input{{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:6px 10px;border-radius:6px;font-size:12px;outline:none}}
          .filters input{{flex:1;min-width:160px}}
          footer{{text-align:center;color:#334155;font-size:11px;margin-top:20px;padding-top:14px;border-top:1px solid #1e293b}}
          </style></head><body>

          <h1>&#x1F6E1; Security Dashboard &mdash; ShopVuln</h1>
          <div class="sub">DevSecOps PFE &middot; {datetime.now().strftime('%d/%m/%Y %H:%M')} &middot; {grand_total} findings</div>

          <div class="kpis">
            <div class="kpi"><div class="n" style="color:#60a5fa">{grand_total}</div><div class="l">Total</div></div>
            <div class="kpi"><div class="n" style="color:#ef4444">{grand_crit}</div><div class="l">Critical</div></div>
            <div class="kpi"><div class="n" style="color:#f97316">{grand_high}</div><div class="l">High</div></div>
            <div class="kpi"><div class="n" style="color:#eab308">{grand_med}</div><div class="l">Medium</div></div>
          </div>

          <div class="tools">
            <div class="tool-card">
              <h3>Semgrep &mdash; SAST</h3>
              <div class="meta">{sem_total} findings &middot; Python/Flask</div>
              <div class="row-stat"><span>High</span><b style="color:#f97316">{len(sem_high)}</b></div>
              {bar(len(sem_high), sem_total or 1, '#f97316')}
              <div class="row-stat"><span>Medium</span><b style="color:#eab308">{len(sem_med)}</b></div>
              {bar(len(sem_med), sem_total or 1, '#eab308')}
            </div>
            <div class="tool-card">
              <h3>Checkov &mdash; IaC</h3>
              <div class="meta">{chk_total} checks &middot; Dockerfile/YAML</div>
              <div class="row-stat"><span>Score</span><b style="color:{score_color}">{chk_score}%</b></div>
              {bar(chk_score, 100, score_color)}
              <div class="row-stat"><span>Failed</span><b style="color:#f97316">{len(chk_failed)}</b></div>
              {bar(len(chk_failed), chk_total or 1, '#f97316')}
            </div>
            <div class="tool-card">
              <h3>ZAP &mdash; DAST</h3>
              <div class="meta">{zap_total} alerts &middot; Full Scan</div>
              <div class="row-stat"><span>High</span><b style="color:#f97316">{zap_high}</b></div>
              {bar(zap_high, zap_total or 1, '#f97316')}
              <div class="row-stat"><span>Medium</span><b style="color:#eab308">{zap_med}</b></div>
              {bar(zap_med, zap_total or 1, '#eab308')}
            </div>
            <div class="tool-card">
              <h3>Trivy &mdash; SCA + Image</h3>
              <div class="meta">{trivy_total} CVE &middot; deps + Docker</div>
              <div class="row-stat"><span>Critical</span><b style="color:#ef4444">{trivy_crit}</b></div>
              {bar(trivy_crit, trivy_total or 1, '#ef4444')}
              <div class="row-stat"><span>High</span><b style="color:#f97316">{trivy_high}</b></div>
              {bar(trivy_high, trivy_total or 1, '#f97316')}
            </div>
          </div>

          <div class="section-title">Synthèse par outil</div>
          <div class="table-wrap"><table>
            <thead><tr><th>#</th><th>Outil</th><th>Type</th><th>Critical</th><th>High</th><th>Medium</th><th>Total</th><th>Security Gate</th></tr></thead>
            <tbody>
              <tr style="border-top:1px solid #1e293b">
                <td style="color:#475569">1</td><td style="color:#a78bfa">Semgrep</td><td style="color:#64748b">SAST</td>
                <td style="color:#64748b">—</td><td style="color:#f97316"><b>{len(sem_high)}</b></td><td style="color:#eab308">{len(sem_med)}</td><td>{sem_total}</td>
                <td>{gate(len(sem_high) <= 10)}</td>
              </tr>
              <tr style="border-top:1px solid #1e293b;background:#ffffff08">
                <td style="color:#475569">2</td><td style="color:#fb923c">Checkov</td><td style="color:#64748b">IaC</td>
                <td style="color:#64748b">—</td><td style="color:#f97316"><b>{len(chk_failed)}</b></td><td style="color:#64748b">—</td><td>{chk_total}</td>
                <td>{gate(chk_score >= 70)}</td>
              </tr>
              <tr style="border-top:1px solid #1e293b">
                <td style="color:#475569">3</td><td style="color:#22d3ee">ZAP</td><td style="color:#64748b">DAST</td>
                <td style="color:#64748b">—</td><td style="color:#f97316"><b>{zap_high}</b></td><td style="color:#eab308">{zap_med}</td><td>{zap_total}</td>
                <td>{gate(zap_high <= 5)}</td>
              </tr>
              <tr style="border-top:1px solid #1e293b;background:#ffffff08">
                <td style="color:#475569">4</td><td style="color:#4ade80">Trivy</td><td style="color:#64748b">SCA + Image</td>
                <td style="color:#ef4444"><b>{trivy_crit}</b></td><td style="color:#f97316">{trivy_high}</td><td style="color:#eab308">{trivy_med}</td><td>{trivy_total}</td>
                <td>{gate(trivy_crit == 0)}</td>
              </tr>
            </tbody>
          </table></div>

          <div class="section-title">Critical &amp; High Findings ({len(all_findings)})</div>
          <div class="filters">
            <select id="f-tool" onchange="filter()">
              <option value="">Tous les outils</option>
              <option value="Semgrep">Semgrep</option>
              <option value="Checkov">Checkov</option>
              <option value="ZAP">ZAP</option>
              <option value="Trivy/SCA">Trivy/SCA</option>
              <option value="Trivy/IMAGE">Trivy/IMAGE</option>
            </select>
            <select id="f-sev" onchange="filter()">
              <option value="">Toutes sévérités</option>
              <option value="CRITICAL">CRITICAL</option>
              <option value="HIGH">HIGH</option>
            </select>
            <input id="f-q" placeholder="Rechercher (CVE, package, check ID, fichier...)" oninput="filter()">
          </div>
          <div class="table-wrap"><table id="t">
            <thead><tr><th style="width:30px"></th><th style="width:30px">#</th><th>Outil</th><th>Sévérité</th><th>Composant / Check</th><th>ID / CVE</th><th>Localisation</th><th style="width:40px">Ref</th></tr></thead>
            <tbody>{rows}</tbody>
          </table></div>

          <footer>ShopVuln &middot; DevSecOps PFE &middot; {datetime.now().strftime('%Y')}</footer>

          <script>
          function toggle(id){{
            var r=document.getElementById(id);
            var b=document.getElementById('btn-'+id);
            if(r.style.display==='none'){{r.style.display='';b.innerHTML='&#9660;'}}
            else{{r.style.display='none';b.innerHTML='&#9658;'}}
          }}
          function filter(){{
            var ft=document.getElementById('f-tool').value;
            var fs=document.getElementById('f-sev').value;
            var fq=document.getElementById('f-q').value.toLowerCase();
            document.querySelectorAll('#t tbody tr.main-row').forEach(function(row){{
              var tds=row.querySelectorAll('td');
              var tool=tds[2]?tds[2].textContent.trim():'';
              var sev=tds[3]?tds[3].textContent.trim():'';
              var txt=row.textContent.toLowerCase();
              var show=(!ft||tool.indexOf(ft)!==-1)&&(!fs||sev===fs)&&(!fq||txt.indexOf(fq)!==-1);
              row.style.display=show?'':'none';
              var det=document.getElementById(row.querySelector('.ebtn').id.replace('btn-',''));
              if(det&&!show)det.style.display='none';
            }});
          }}
          </script>
          </body></html>"""

          with open("security-dashboard.html","w",encoding="utf-8") as f:
              f.write(html)
          print(f"[OK] Dashboard: {grand_total} findings total, {len(all_findings)} critical/high")
          EOF
      - name: Upload Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: final-security-dashboard
          path: security-dashboard.html
# ═══════════════════════════════════════════════
# JOB 7 — DEPLOY STAGING (CD)
# ═══════════════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging - Railway
    runs-on: ubuntu-latest
    needs: [generate-dashboard]
    if: success()
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway staging
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service 2b5a45d7-6412-4d9e-b24d-0f1a09ac3519 \
          echo "url=https://devsecops-pfe-production.up.railway.app" >> $GITHUB_OUTPUT

      - name: Smoke test
        run: |
          echo "Waiting for app to start..."
          sleep 40
          curl -f https://devsecops-pfe-production.up.railway.app \
            && echo "SMOKE TEST PASSED — app is UP" \
            || (echo "SMOKE TEST FAILED" && exit 1)

      - name: Upload deploy summary
        if: always()
        run: |
          echo "=== Deploy Summary ===" 
          echo "Commit : ${{ github.sha }}"
          echo "Branch : ${{ github.ref_name }}"
          echo "URL    : ${{ steps.deploy.outputs.url }}"
          echo "Status : ${{ job.status }}"