name: DevSecOps Pipeline - ShopVuln

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

# ═══════════════════════════════════════════════
# JOB 0 — SECRET SCANNING GITLEAKS
# ═══════════════════════════════════════════════
  secret-scanning:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug - List files
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== shopvuln/ ==="
          ls -la shopvuln/ || echo "shopvuln/ not found!"

      - name: Run Gitleaks
        run: |
          mkdir -p reports
          docker run --rm \
            -v ${{ github.workspace }}/shopvuln:/repo \
            -v ${{ github.workspace }}/reports:/report \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source="/repo" \
            --report-format sarif \
            --report-path /report/gitleaks.sarif \
            --verbose || true

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: reports/gitleaks.sarif
          if-no-files-found: warn

# ═══════════════════════════════════════════════
# JOB 1 — SAST SEMGREP
# ═══════════════════════════════════════════════
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug - List shopvuln files
        run: |
          echo "=== shopvuln/ ==="
          ls -la shopvuln/
          echo "=== shopvuln/app/ ==="
          ls -la shopvuln/app/

      - name: Install Semgrep
        run: pip install semgrep --break-system-packages

      - name: Run Semgrep SAST
        run: |
          mkdir -p reports
          semgrep scan \
            shopvuln \
            --config auto \
            --json > reports/semgrep-report.json || true
        continue-on-error: true

      - name: Security Gate
        run: |
          python3 << 'EOF'
          import json, sys
          try:
              with open("reports/semgrep-report.json") as f:
                  data = json.load(f)
              results = data.get("results", []) if isinstance(data, dict) else []
              errors  = [r for r in results if isinstance(r, dict) and r.get("extra",{}).get("severity") == "ERROR"]
              print(f"High findings detected: {len(errors)}")
              if len(errors) > 50:
                  print("SECURITY GATE FAILED")
                  sys.exit(1)
              else:
                  print("SECURITY GATE PASSED")
          except Exception as e:
              print(f"Error parsing report: {e}")
          EOF

      - name: Generate Semgrep HTML Report
        run: |
          python3 << 'EOF'
          import json
          from datetime import datetime

          try:
              with open("reports/semgrep-report.json") as f:
                  data = json.load(f)
              results = data.get("results", []) if isinstance(data, dict) else data if isinstance(data, list) else []
          except Exception:
              results = []

          results = [r for r in results if isinstance(r, dict) and "check_id" in r]

          errors   = [r for r in results if r.get("extra",{}).get("severity") == "ERROR"]
          warnings = [r for r in results if r.get("extra",{}).get("severity") == "WARNING"]
          infos    = [r for r in results if r.get("extra",{}).get("severity") == "INFO"]
          files    = len(set(r.get("path","") for r in results))

          findings = []
          for r in results:
              meta   = r.get("extra",{}).get("metadata",{})
              cwes   = meta.get("cwe",   [])
              owasps = meta.get("owasp", [])
              refs   = meta.get("references", [])
              sev    = r.get("extra",{}).get("severity","INFO")
              rule   = r.get("check_id","")
              name   = rule.split(".")[-1].replace("-"," ").title()
              path   = r.get("path","")
              line   = r.get("start",{}).get("line","")
              msg    = r.get("extra",{}).get("message","").replace('"','&quot;').replace("'","&#39;")
              impact = meta.get("impact","N/A")
              parts  = rule.split(".")
              cat    = parts[-2].replace("-"," ").title() if len(parts) >= 2 else "Other"
              findings.append({
                  "sev": sev, "rule": rule, "name": name, "file": path,
                  "line": str(line), "cwe": cwes[0].split(":")[0] if cwes else "N/A",
                  "owasp": owasps[0].split(" - ")[0] if owasps else "N/A",
                  "impact": impact, "msg": msg, "cat": cat,
                  "ref": refs[0] if refs else ""
              })

          cats = sorted(set(f["cat"] for f in findings))
          cat_options = "".join(f'<option value="{c}">{c}</option>' for c in cats)

          rows = ""
          for i, f in enumerate(findings):
              sev_color = {"ERROR":"#ef4444","WARNING":"#eab308","INFO":"#60a5fa"}.get(f["sev"],"#94a3b8")
              sev_label = {"ERROR":"HIGH","WARNING":"MEDIUM","INFO":"INFO"}.get(f["sev"],f["sev"])
              imp_color = {"HIGH":"#ef4444","MEDIUM":"#eab308","LOW":"#60a5fa"}.get(f["impact"],"#94a3b8")
              filename  = f["file"].split("/")[-1]
              ref_html  = f'<a href="{f["ref"]}" target="_blank" style="color:#60a5fa;font-size:11px;text-decoration:none">Voir reference</a>' if f["ref"] else ""
              detail_id = f"detail-{i}"
              rows += f"""<tr class="main-row" data-sev="{f['sev']}" data-cat="{f['cat']}" data-txt="{f['name'].lower()} {f['file'].lower()} {f['cwe'].lower()} {f['owasp'].lower()}" onclick="toggle('{detail_id}')">
                <td><button class="expand-btn" id="btn-{detail_id}">&#9658;</button></td>
                <td><span style="background:{sev_color}22;color:{sev_color};padding:2px 8px;border-radius:10px;font-size:11px">{sev_label}</span></td>
                <td style="color:#f1f5f9">{f['name']}</td>
                <td><code style="background:#0f172a;padding:2px 5px;border-radius:3px;font-size:10px;color:#7dd3fc">{filename}</code></td>
                <td style="font-family:monospace;font-size:11px;color:#64748b">{f['line']}</td>
                <td><span style="background:#7c3aed22;color:#a78bfa;padding:2px 7px;border-radius:10px;font-size:10px">{f['cwe']}</span></td>
                <td><span style="background:#0891b222;color:#22d3ee;padding:2px 7px;border-radius:10px;font-size:10px">{f['owasp']}</span></td>
                <td style="color:{imp_color};font-size:11px;font-weight:500">{f['impact']}</td>
              </tr>
              <tr class="detail-row" id="{detail_id}" style="display:none">
                <td colspan="8">
                  <div style="padding:14px 18px;background:#0d1b2e;border-bottom:1px solid #334155">
                    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:12px">
                      <div>
                        <div style="color:#64748b;font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px">Fichier complet</div>
                        <div style="color:#cbd5e1;font-size:12px"><code style="background:#0f172a;padding:2px 5px;border-radius:3px;font-size:10px;color:#7dd3fc">{f['file']}</code></div>
                      </div>
                      <div>
                        <div style="color:#64748b;font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px">Regle ID</div>
                        <div style="color:#64748b;font-size:10px;word-break:break-all">{f['rule']}</div>
                      </div>
                      <div>
                        <div style="color:#64748b;font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px">Impact</div>
                        <div><span style="background:{sev_color}22;color:{sev_color};padding:2px 8px;border-radius:10px;font-size:11px">{f['impact']}</span></div>
                      </div>
                    </div>
                    <div style="color:#64748b;font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">Message</div>
                    <div style="background:#1e293b;border-left:3px solid #7c3aed;padding:9px 13px;border-radius:0 6px 6px 0;font-size:12px;color:#94a3b8;line-height:1.6">{f['msg']}</div>
                    <div style="background:#0f172a;border:1px solid #334155;padding:7px 12px;border-radius:6px;font-family:monospace;font-size:11px;color:#4ade80;margin-top:8px">&gt;&gt;&gt; {f['file']}:{f['line']}</div>
                    <div style="margin-top:8px">{ref_html}</div>
                  </div>
                </td>
              </tr>"""

          html = f"""<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Semgrep SAST - ShopVuln</title>
          <style>*{{margin:0;padding:0;box-sizing:border-box}}body{{font-family:Segoe UI,sans-serif;background:#0f172a;color:#e2e8f0;padding:24px}}
          .grid{{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 24px}}
          .card{{background:#1e293b;padding:16px;border-radius:10px;border:1px solid #334155;text-align:center}}
          .num{{font-size:32px;font-weight:500}}
          .filters{{display:flex;gap:8px;margin-bottom:14px}}
          .filters select,.filters input{{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:6px 10px;border-radius:6px;font-size:12px}}
          table{{width:100%;border-collapse:collapse;border:1px solid #334155;border-radius:10px;overflow:hidden}}
          th{{background:#0f172a;padding:10px 12px;font-size:11px;color:#94a3b8;text-align:left}}
          td{{padding:9px 12px;font-size:12px;border-top:1px solid #1e293b}}
          .main-row{{cursor:pointer}}.main-row:hover{{background:#1e293b}}
          .expand-btn{{background:none;border:none;color:#475569;cursor:pointer;font-size:13px;padding:2px 6px;border-radius:4px}}
          footer{{text-align:center;color:#334155;font-size:11px;margin-top:20px;padding-top:14px;border-top:1px solid #1e293b}}</style></head><body>
          <h1 style="font-size:20px">Semgrep SAST Report - ShopVuln</h1>
          <p style="color:#94a3b8;font-size:13px;margin-top:4px">{datetime.now().strftime('%d/%m/%Y %H:%M')} · {len(results)} findings</p>
          <div class="grid">
            <div class="card"><div class="num" style="color:#60a5fa">{len(results)}</div><div style="font-size:12px;color:#94a3b8">Total</div></div>
            <div class="card"><div class="num" style="color:#ef4444">{len(errors)}</div><div style="font-size:12px;color:#94a3b8">High (ERROR)</div></div>
            <div class="card"><div class="num" style="color:#eab308">{len(warnings)}</div><div style="font-size:12px;color:#94a3b8">Medium (WARNING)</div></div>
            <div class="card"><div class="num" style="color:#a78bfa">{files}</div><div style="font-size:12px;color:#94a3b8">Fichiers</div></div>
          </div>
          <div class="filters">
            <select id="sev" onchange="filter()"><option value="">All Severities</option><option value="ERROR">HIGH (ERROR)</option><option value="WARNING">MEDIUM (WARNING)</option><option value="INFO">INFO</option></select>
            <select id="cat" onchange="filter()"><option value="">All Categories</option>{cat_options}</select>
            <input id="q" placeholder="Search (file, rule, CWE, OWASP...)" oninput="filter()">
          </div>
          <table id="t">
            <thead><tr><th style="width:34px"></th><th>Severity</th><th>Vulnerability</th><th>File</th><th>Line</th><th>CWE</th><th>OWASP</th><th>Impact</th></tr></thead>
            <tbody>{rows}</tbody>
          </table>
          <footer>Semgrep OSS - ShopVuln DevSecOps PFE</footer>
          <script>
          function toggle(id){{
            var row=document.getElementById(id);
            var btn=document.getElementById('btn-'+id);
            if(row.style.display==='none'){{row.style.display='';btn.innerHTML='&#9660;'}}
            else{{row.style.display='none';btn.innerHTML='&#9658;'}}
          }}
          function filter(){{
            var s=document.getElementById('sev').value;
            var c=document.getElementById('cat').value;
            var q=document.getElementById('q').value.toLowerCase();
            document.querySelectorAll('#t tbody tr.main-row').forEach(function(row){{
              var show=(!s||row.dataset.sev===s)&&(!c||row.dataset.cat===c)&&(!q||row.dataset.txt.includes(q));
              row.style.display=show?'':'none';
              var detId=row.querySelector('.expand-btn').id.replace('btn-','');
              var det=document.getElementById(detId);
              if(!show&&det)det.style.display='none';
            }});
          }}
          </script>
          </body></html>"""

          with open("reports/semgrep-report.html","w") as f:
              f.write(html)
          print(f"Semgrep report — {len(results)} findings ({len(errors)} high, {len(warnings)} medium)")
          EOF

      - name: Upload Semgrep Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sast-report
          path: reports/
# ═══════════════════════════════════════════════
# JOB 2 — IaC CHECKOV
# ═══════════════════════════════════════════════
  iac-checkov:
    name: IaC Security - Checkov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov --break-system-packages

      - name: Run Checkov
        run: |
          mkdir -p reports
          checkov -d shopvuln \
            --framework dockerfile yaml \
            --output json \
            --output-file-path reports/ \
            --quiet \
            --soft-fail || true
          mv reports/results_json.json reports/checkov-report.json 2>/dev/null || true

      - name: Upload Checkov Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-report
          path: reports/
          if-no-files-found: warn

# ═══════════════════════════════════════════════
# JOB 3 — BUILD DOCKER IMAGE
# ═══════════════════════════════════════════════
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [secret-scanning, sast-semgrep, iac-checkov]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Dockerfile
        run: |
          echo "=== Files in shopvuln/ ==="
          ls -la shopvuln/
          echo ""
          if [ -f shopvuln/Dockerfile ]; then
            echo "✅ Dockerfile found"
            cat shopvuln/Dockerfile
          else
            echo "❌ Dockerfile NOT found!"
            exit 1
          fi

      - name: Build Docker Image
        run: |
          cd shopvuln
          docker build -t shopvuln:latest .

      - name: Save Docker Image
        run: docker save shopvuln:latest -o image.tar

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

# ═══════════════════════════════════════════════
# JOB 4 — DAST ZAP
# ═══════════════════════════════════════════════
  dast-scan:
    name: DAST Scan - ZAP
    runs-on: ubuntu-latest
    needs: build-image
    if: always()
    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker Image
        run: docker load -i image.tar

      - name: Run ShopVuln App
        run: |
          docker run -d -p 5000:5000 --name shopvuln shopvuln:latest
          echo "Waiting for ShopVuln..."
          for i in {1..30}; do
            curl -sf http://localhost:5000 && echo "App ready!" && break
            echo "Attempt $i/30..."
            sleep 10
          done

      - name: ZAP Full Scan
        run: |
          mkdir -p ${{ github.workspace }}/reports/zap
          chmod 777 ${{ github.workspace }}/reports/zap
          docker run --network=host \
            -v ${{ github.workspace }}/reports/zap:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://localhost:5000 \
            -j \
            -r zap-full-report.html \
            -J zap-full-report.json \
            -m 10 \
            -z "-config scanner.attackStrength=HIGH \
                -config scanner.alertThreshold=LOW \
                -config spider.maxDepth=5 \
                -config spider.maxChildren=10" \
            -I || true

      - name: ZAP API Scan
        run: |
          docker run --network=host \
            -v ${{ github.workspace }}/reports/zap:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t http://localhost:5000/api/products \
            -f openapi \
            -r zap-api-report.html \
            -J zap-api-report.json \
            -I || true

      - name: Upload DAST Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-dast-security-reports
          path: ${{ github.workspace }}/reports/

# ═══════════════════════════════════════════════
# JOB 5 — TRIVY SCA + IMAGE
# ═══════════════════════════════════════════════
  trivy-scan:
    name: Trivy SCA + Image Scan
    runs-on: ubuntu-latest
    needs: build-image
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          cd shopvuln
          docker build -t shopvuln:latest .

      - name: Create reports directory
        run: mkdir -p reports/trivy

      - name: Trivy SCA Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: shopvuln
          format: json
          output: reports/trivy/trivy-sca.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: shopvuln:latest
          format: json
          output: reports/trivy/trivy-image.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      - name: Generate Trivy Dashboard
        run: |
          python3 << 'EOF'
          import json
          from datetime import datetime

          def load(path):
              try:
                  with open(path) as f:
                      data = json.load(f)
                  return data if isinstance(data, dict) else {}
              except:
                  return {}

          image = load("reports/trivy/trivy-image.json")
          sca   = load("reports/trivy/trivy-sca.json")
          findings = []

          def cve_link(vid):
              return f"https://nvd.nist.gov/vuln/detail/{vid}" if str(vid).startswith("CVE-") else f"https://osv.dev/vulnerability/{vid}"

          def parse(data, source):
              if not isinstance(data, dict):
                  return
              for r in data.get("Results", []) or []:
                  if not isinstance(r, dict):
                      continue
                  for v in r.get("Vulnerabilities", []) or []:
                      if not isinstance(v, dict):
                          continue
                      vid   = v.get("VulnerabilityID", "")
                      fixed = v.get("FixedVersion", "") or ""
                      findings.append({
                          "source": source, "pkg": v.get("PkgName",""),
                          "id": vid, "severity": v.get("Severity",""),
                          "installed": v.get("InstalledVersion","") or "—",
                          "fixed": fixed.strip() if fixed.strip() else "—",
                          "link": cve_link(vid)
                      })

          parse(image, "IMAGE")
          parse(sca, "SCA")

          total = len(findings)
          crit  = len([f for f in findings if f["severity"]=="CRITICAL"])
          high  = len([f for f in findings if f["severity"]=="HIGH"])
          med   = len([f for f in findings if f["severity"]=="MEDIUM"])
          sev_color = {"CRITICAL":"#ef4444","HIGH":"#f97316","MEDIUM":"#eab308","LOW":"#94a3b8"}

          rows = ""
          for f in findings:
              c = sev_color.get(f["severity"],"#94a3b8")
              rows += f"""<tr data-sev="{f['severity']}" data-src="{f['source']}" data-txt="{f['pkg'].lower()} {f['id'].lower()}">
                <td><code>{f['source']}</code></td><td>{f['pkg']}</td><td><code>{f['id']}</code></td>
                <td><span style="background:{c}22;color:{c};padding:2px 8px;border-radius:10px;font-size:11px">{f['severity']}</span></td>
                <td style="font-family:monospace;font-size:11px;color:#fbbf24">{f['installed']}</td>
                <td>{"<b style='color:#22c55e'>"+f['fixed']+"</b>" if f['fixed']!="—" else "—"}</td>
                <td><a href="{f['link']}" target="_blank" style="color:#60a5fa">🔗</a></td></tr>"""

          html = f"""<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Trivy - ShopVuln</title>
          <style>*{{margin:0;padding:0;box-sizing:border-box}}body{{font-family:Segoe UI,sans-serif;background:#0f172a;color:#e2e8f0;padding:24px}}
          .grid{{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 24px}}
          .card{{background:#1e293b;padding:16px;border-radius:10px;border:1px solid #334155;text-align:center}}
          .num{{font-size:32px;font-weight:500}}
          .filters{{display:flex;gap:8px;margin-bottom:14px}}
          .filters select,.filters input{{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:6px 10px;border-radius:6px;font-size:12px}}
          table{{width:100%;border-collapse:collapse;border:1px solid #334155;border-radius:10px;overflow:hidden}}
          th{{background:#0f172a;padding:10px 12px;font-size:11px;color:#94a3b8;text-align:left}}
          td{{padding:9px 12px;font-size:12px;border-top:1px solid #1e293b}}</style></head><body>
          <h1 style="font-size:20px">🛡️ Trivy Dashboard — ShopVuln</h1>
          <p style="color:#94a3b8;font-size:13px;margin-top:4px">{datetime.now().strftime('%d/%m/%Y %H:%M')} · {total} vulnerabilities</p>
          <div class="grid">
            <div class="card"><div class="num" style="color:#60a5fa">{total}</div><div style="font-size:12px;color:#94a3b8">Total</div></div>
            <div class="card"><div class="num" style="color:#ef4444">{crit}</div><div style="font-size:12px;color:#94a3b8">Critical</div></div>
            <div class="card"><div class="num" style="color:#f97316">{high}</div><div style="font-size:12px;color:#94a3b8">High</div></div>
            <div class="card"><div class="num" style="color:#eab308">{med}</div><div style="font-size:12px;color:#94a3b8">Medium</div></div>
          </div>
          <div class="filters">
            <select id="sev" onchange="filter()"><option value="">All</option><option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option></select>
            <select id="src" onchange="filter()"><option value="">All</option><option>IMAGE</option><option>SCA</option></select>
            <input id="q" placeholder="Search..." oninput="filter()">
          </div>
          <table id="t"><thead><tr><th>Source</th><th>Package</th><th>CVE</th><th>Severity</th><th>Installed</th><th>Fixed</th><th>Link</th></tr></thead>
          <tbody>{rows}</tbody></table>
          <script>function filter(){{var s=document.getElementById('sev').value,r=document.getElementById('src').value,q=document.getElementById('q').value.toLowerCase();document.querySelectorAll('#t tbody tr').forEach(function(row){{row.style.display=(!s||row.dataset.sev===s)&&(!r||row.dataset.src===r)&&(!q||row.dataset.txt.includes(q))?'':'none'}})}}</script>
          </body></html>"""

          with open("reports/trivy/dashboard.html","w") as f:
              f.write(html)
          print(f"Trivy dashboard — {total} CVE")
          EOF

      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-report
          path: reports/trivy/

# ═══════════════════════════════════════════════
# JOB 6 — DASHBOARD GLOBAL
# ═══════════════════════════════════════════════
  generate-dashboard:
    name: Generate Security Dashboard
    runs-on: ubuntu-latest
    needs: [sast-semgrep, iac-checkov, trivy-scan, dast-scan]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Download Semgrep Report
        uses: actions/download-artifact@v4
        with:
          name: semgrep-sast-report
          path: reports/semgrep
        continue-on-error: true

      - name: Download DAST Reports
        uses: actions/download-artifact@v4
        with:
          name: full-dast-security-reports
          path: reports/dast-combined
        continue-on-error: true

      - name: Download Trivy Report
        uses: actions/download-artifact@v4
        with:
          name: trivy-security-report
          path: reports/trivy
        continue-on-error: true

      - name: Debug - Show downloaded files
        run: |
          echo "=== All reports ==="
          find reports/ -type f 2>/dev/null || echo "No reports found"

      - name: Generate HTML Dashboard
        run: |
          python3 << 'EOF'
          import json, glob
          from datetime import datetime

          def safe_load(pattern):
              files = glob.glob(pattern, recursive=True)
              if not files:
                  print(f"[WARN] Not found: {pattern}")
                  return None
              try:
                  with open(files[0], 'r', encoding='utf-8', errors='replace') as f:
                      return json.load(f)
              except Exception as e:
                  print(f"[WARN] {files[0]}: {e}")
                  return None

          def cve_link(vid):
              vid = str(vid)
              if vid.startswith("CVE-"):
                  return f"https://nvd.nist.gov/vuln/detail/{vid}"
              return f"https://osv.dev/vulnerability/{vid}"

          def bar(val, maxi, color):
              pct = int((val/maxi)*100) if maxi > 0 else 0
              return f'<div style="height:5px;background:#0f172a;border-radius:3px;margin-top:5px"><div style="height:5px;width:{pct}%;background:{color};border-radius:3px"></div></div>'

          def badge(s):
              c = {"CRITICAL":"#ef4444","HIGH":"#f97316","MEDIUM":"#eab308"}.get(s,"#94a3b8")
              return f'<span style="background:{c}22;color:{c};padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500">{s}</span>'

          def status(ok):
              return '<span style="color:#22c55e;font-weight:500">✓ OK</span>' if ok else '<span style="color:#ef4444;font-weight:500">✗ KO</span>'

          # ══════════════════════════════════════
          # SEMGREP
          # ══════════════════════════════════════
          sem_raw = safe_load("reports/semgrep/**/*.json")
          sem_results = []
          if isinstance(sem_raw, dict):
              sem_results = sem_raw.get("results", [])
          elif isinstance(sem_raw, list):
              sem_results = sem_raw

          # Filtre les vrais findings
          sem_results = [r for r in sem_results if isinstance(r, dict) and "check_id" in r]
          sem_high = [r for r in sem_results if r.get("extra",{}).get("severity") == "ERROR"]
          sem_med  = [r for r in sem_results if r.get("extra",{}).get("severity") == "WARNING"]

          sem_findings = []
          for r in sem_high:
              meta = r.get("extra",{}).get("metadata",{})
              cwes = meta.get("cwe",[])
              refs = meta.get("references",[])
              sem_findings.append({
                  "tool":"Semgrep","severity":"HIGH",
                  "id": cwes[0] if cwes else "N/A",
                  "pkg": r.get("check_id","").split(".")[-1],
                  "file": f"{r.get('path','')}:{r.get('start',{}).get('line','')}",
                  "desc": r.get("extra",{}).get("message","")[:120],
                  "link": refs[0] if refs else ""
              })

          print(f"[OK] Semgrep: {len(sem_results)} total, {len(sem_high)} high, {len(sem_med)} medium")

          # ══════════════════════════════════════
          # ZAP
          # ══════════════════════════════════════
          zap_raw = safe_load("reports/dast-combined/**/zap-full-report.json")
          zap_high = zap_med = 0
          zap_findings = []

          if zap_raw is not None:
              # Normalise sites
              sites = []
              if isinstance(zap_raw, dict):
                  s = zap_raw.get("site", [])
                  if isinstance(s, dict):
                      sites = [s]
                  elif isinstance(s, list):
                      sites = s
              elif isinstance(zap_raw, list):
                  for item in zap_raw:
                      if isinstance(item, dict):
                          if "alerts" in item:
                              sites.append(item)
                          elif "site" in item:
                              s = item["site"]
                              if isinstance(s, dict):
                                  sites.append(s)
                              elif isinstance(s, list):
                                  sites.extend(s)

              for site in sites:
                  if not isinstance(site, dict):
                      continue
                  alerts = site.get("alerts", [])
                  if not isinstance(alerts, list):
                      continue
                  for alert in alerts:
                      if not isinstance(alert, dict):
                          continue
                      rc    = str(alert.get("riskcode","0"))
                      name  = str(alert.get("name",""))
                      cweid = str(alert.get("cweid","")).strip()
                      desc  = str(alert.get("desc","")).replace("<p>","").replace("</p>","").strip()[:120]
                      insts = alert.get("instances",[])
                      uri   = ""
                      if isinstance(insts, list) and insts and isinstance(insts[0], dict):
                          uri = insts[0].get("uri","")

                      if rc == "3":
                          zap_high += 1
                          zap_findings.append({
                              "tool":"ZAP","severity":"HIGH",
                              "id": f"CWE-{cweid}" if cweid and cweid!="0" else name,
                              "pkg": name, "file": uri, "desc": desc,
                              "link": f"https://cwe.mitre.org/data/definitions/{cweid}.html" if cweid and cweid!="0" else ""
                          })
                      elif rc == "2":
                          zap_med += 1

          print(f"[OK] ZAP: {zap_high} high, {zap_med} medium")

          # ══════════════════════════════════════
          # TRIVY
          # ══════════════════════════════════════
          trivy_crit = trivy_high = trivy_med = 0
          trivy_findings = []

          for pattern, src in [
              ("reports/trivy/trivy-sca.json", "SCA"),
              ("reports/trivy/trivy-image.json", "IMAGE"),
              ("reports/trivy/**/trivy-sca.json", "SCA"),
              ("reports/trivy/**/trivy-image.json", "IMAGE")
          ]:
              td = safe_load(pattern)
              if not isinstance(td, dict):
                  continue
              for res in td.get("Results", []) or []:
                  if not isinstance(res, dict):
                      continue
                  for v in res.get("Vulnerabilities", []) or []:
                      if not isinstance(v, dict):
                          continue
                      sev = v.get("Severity","")
                      vid = v.get("VulnerabilityID","")
                      entry = {
                          "tool":f"Trivy ({src})", "severity":sev,
                          "id":vid, "pkg":v.get("PkgName",""),
                          "file":v.get("InstalledVersion",""),
                          "desc":str(v.get("Title",""))[:120],
                          "link":cve_link(vid)
                      }
                      if sev == "CRITICAL":
                          trivy_crit += 1; trivy_findings.append(entry)
                      elif sev == "HIGH":
                          trivy_high += 1; trivy_findings.append(entry)
                      elif sev == "MEDIUM":
                          trivy_med += 1

          # Déduplique trivy (on cherche dans 2 patterns)
          seen = set()
          unique_trivy = []
          for f in trivy_findings:
              key = f"{f['id']}_{f['pkg']}_{f['tool']}"
              if key not in seen:
                  seen.add(key)
                  unique_trivy.append(f)
          trivy_findings = unique_trivy
          trivy_crit = len([f for f in trivy_findings if f["severity"]=="CRITICAL"])
          trivy_high = len([f for f in trivy_findings if f["severity"]=="HIGH"])

          print(f"[OK] Trivy: {trivy_crit} critical, {trivy_high} high, {trivy_med} medium")

          # ══════════════════════════════════════
          # TOTAUX
          # ══════════════════════════════════════
          sem_total   = len(sem_results)
          zap_total   = zap_high + zap_med
          trivy_total = trivy_crit + trivy_high + trivy_med
          grand_total = sem_total + zap_total + trivy_total
          grand_crit  = trivy_crit
          grand_high  = len(sem_high) + zap_high + trivy_high
          grand_med   = len(sem_med) + zap_med + trivy_med

          all_findings = sem_findings + zap_findings + trivy_findings
          all_findings.sort(key=lambda x: 0 if x["severity"]=="CRITICAL" else 1)

          # ══════════════════════════════════════
          # HTML
          # ══════════════════════════════════════
          rows = ""
          for i, f in enumerate(all_findings):
              link_cell = f'<a href="{f["link"]}" target="_blank" style="color:#60a5fa">🔗</a>' if f.get("link") else "—"
              desc_safe = str(f.get("desc","")).replace("<","&lt;").replace(">","&gt;")
              rows += f"""<tr style="border-top:1px solid #0f172a">
                <td style="padding:8px 10px;color:#64748b">{i+1}</td>
                <td style="padding:8px 10px"><code style="background:#0f172a;padding:2px 6px;border-radius:3px;color:#7dd3fc;font-size:10px">{f["tool"]}</code></td>
                <td style="padding:8px 10px">{badge(f["severity"])}</td>
                <td style="padding:8px 10px;color:#f8fafc;font-size:11px">{str(f["id"])[:40]}</td>
                <td style="padding:8px 10px;color:#94a3b8;font-size:11px">{str(f["pkg"])[:35]}</td>
                <td style="padding:8px 10px;color:#94a3b8;font-size:11px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{desc_safe}</td>
                <td style="padding:8px 10px">{link_cell}</td>
              </tr>"""

          html = f"""<!DOCTYPE html><html lang="en"><head>
          <meta charset="UTF-8"><title>Security Dashboard — ShopVuln</title>
          <style>
          *{{margin:0;padding:0;box-sizing:border-box}}
          body{{font-family:Segoe UI,sans-serif;background:#0f172a;color:#e2e8f0;padding:28px}}
          h1{{font-size:22px;font-weight:600}}
          .sub{{color:#64748b;font-size:13px;margin:4px 0 24px}}
          .stats{{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}}
          .stat{{background:#1e293b;border-radius:10px;padding:16px;border:1px solid #334155;text-align:center}}
          .stat .n{{font-size:34px;font-weight:600}}
          .stat .l{{font-size:11px;color:#64748b;text-transform:uppercase}}
          .tools{{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px}}
          .tool{{background:#1e293b;border-radius:10px;padding:16px;border:1px solid #334155}}
          .tool h3{{font-size:13px;margin-bottom:3px}}
          .tool .meta{{font-size:11px;color:#64748b;margin-bottom:10px}}
          .row{{display:flex;justify-content:space-between;margin-top:6px}}
          .row span{{font-size:12px;color:#94a3b8}}
          h2{{font-size:15px;font-weight:500;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #334155}}
          table{{width:100%;border-collapse:collapse;background:#1e293b;border-radius:10px;overflow:hidden;border:1px solid #334155;font-size:12px;margin-bottom:28px}}
          th{{background:#0f172a;padding:9px 10px;font-size:10px;color:#64748b;text-align:left;text-transform:uppercase}}
          footer{{text-align:center;color:#334155;font-size:11px;margin-top:16px;padding-top:16px;border-top:1px solid #1e293b}}
          </style></head><body>

          <h1>🛡️ Security Dashboard — ShopVuln</h1>
          <div class="sub">DevSecOps Pipeline · {datetime.now().strftime('%d/%m/%Y %H:%M')} · {grand_total} findings</div>

          <div class="stats">
            <div class="stat"><div class="n" style="color:#60a5fa">{grand_total}</div><div class="l">Total</div></div>
            <div class="stat"><div class="n" style="color:#ef4444">{grand_crit}</div><div class="l">Critical</div></div>
            <div class="stat"><div class="n" style="color:#f97316">{grand_high}</div><div class="l">High</div></div>
            <div class="stat"><div class="n" style="color:#eab308">{grand_med}</div><div class="l">Medium</div></div>
          </div>

          <div class="tools">
            <div class="tool">
              <h3>SAST — Semgrep</h3>
              <div class="meta">{sem_total} findings · Python/Flask</div>
              <div class="row"><span>High</span><b style="color:#f97316">{len(sem_high)}</b></div>
              {bar(len(sem_high), sem_total or 1, '#f97316')}
              <div class="row"><span>Medium</span><b style="color:#eab308">{len(sem_med)}</b></div>
              {bar(len(sem_med), sem_total or 1, '#eab308')}
            </div>
            <div class="tool">
              <h3>DAST — OWASP ZAP</h3>
              <div class="meta">{zap_total} alerts · live app</div>
              <div class="row"><span>High</span><b style="color:#f97316">{zap_high}</b></div>
              {bar(zap_high, zap_total or 1, '#f97316')}
              <div class="row"><span>Medium</span><b style="color:#eab308">{zap_med}</b></div>
              {bar(zap_med, zap_total or 1, '#eab308')}
            </div>
            <div class="tool">
              <h3>SCA + Image — Trivy</h3>
              <div class="meta">{trivy_total} CVE · deps + Docker</div>
              <div class="row"><span>Critical</span><b style="color:#ef4444">{trivy_crit}</b></div>
              {bar(trivy_crit, trivy_total or 1, '#ef4444')}
              <div class="row"><span>High</span><b style="color:#f97316">{trivy_high}</b></div>
              {bar(trivy_high, trivy_total or 1, '#f97316')}
            </div>
          </div>

          <h2>Summary by Tool</h2>
          <table>
            <tr><th>#</th><th>Tool</th><th>Type</th><th>Critical</th><th>High</th><th>Medium</th><th>Total</th><th>Status</th></tr>
            <tr><td style="padding:10px">1</td><td>Semgrep</td><td style="color:#64748b">SAST</td><td>—</td><td style="color:#f97316"><b>{len(sem_high)}</b></td><td style="color:#eab308">{len(sem_med)}</td><td>{sem_total}</td><td>{status(len(sem_high)<=10)}</td></tr>
            <tr><td style="padding:10px">2</td><td>ZAP</td><td style="color:#64748b">DAST</td><td>—</td><td style="color:#f97316"><b>{zap_high}</b></td><td style="color:#eab308">{zap_med}</td><td>{zap_total}</td><td>{status(zap_high<=5)}</td></tr>
            <tr><td style="padding:10px">3</td><td>Trivy</td><td style="color:#64748b">SCA</td><td style="color:#ef4444"><b>{trivy_crit}</b></td><td style="color:#f97316">{trivy_high}</td><td style="color:#eab308">{trivy_med}</td><td>{trivy_total}</td><td>{status(trivy_crit==0)}</td></tr>
          </table>

          <h2>Critical & High Findings ({len(all_findings)})</h2>
          <table>
            <thead><tr><th>#</th><th>Tool</th><th>Severity</th><th>ID / CVE</th><th>Component</th><th>Description</th><th>Ref</th></tr></thead>
            <tbody>
            {rows if rows else '<tr><td colspan="7" style="padding:20px;text-align:center;color:#64748b">No critical/high findings</td></tr>'}
            </tbody>
          </table>

          <footer>ShopVuln · DevSecOps PFE · {datetime.now().strftime('%Y')}</footer>
          </body></html>"""

          with open("security-dashboard.html","w") as f:
              f.write(html)
          print(f"[OK] Dashboard: {grand_total} findings, {len(all_findings)} critical/high")
          EOF

      - name: Upload Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: final-security-dashboard
          path: security-dashboard.html