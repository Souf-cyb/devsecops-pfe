            new Chart(document.getElementById('chart3'), {{
              type: 'bar',
              data: {{
                labels: ['Critical','High','Medium','Low'],
                datasets: [{{
                  data: [{depcheck['critical']}, {depcheck['high']}, {depcheck['medium']}, {depcheck['low']}],
                  backgroundColor: ['#8e0000','#f4512c','#ff9f00','#37b24d'],
                  borderRadius: 3
                }}]
              }},
              options: {{ ...gOpts, indexAxis: 'y' }}
            }});
          </script>
 
          </body>
          </html>"""
 
          os.makedirs("reports", exist_ok=True)
          with open("reports/security-dashboard.html", "w") as f:
              f.write(html)
 
          print(f"Dashboard generated!")
          print(f"Semgrep  : {semgrep['total']} findings")
          print(f"ZAP      : {zap['total']} findings")
          print(f"DepCheck : {depcheck['total']} CVEs")
          print(f"Nuclei   : {nuclei['total']} findings")
          print(f"Checkov  : {checkov['total']} misconfigs")
          print(f"Trivy    : {trivy['total']} vulns")
          print(f"TOTAL    : {total} findings")
          EOF

      - name: Upload Security Dashboard
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-dashboard
          path: reports/security-dashboard.html