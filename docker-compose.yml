version: '3.8'

services:
  web:
    build: ./shopvuln
    ports:
      # ⚠️ MISCONFIG : Exposer le port sur toutes les interfaces (0.0.0.0) au lieu de 127.0.0.1
      - "5000:5000"
    volumes:
      - ./shopvuln/app/shop.db:/app/app/shop.db
    environment:
      # ⚠️ MISCONFIG : Mode Debug activé en environnement de développement/fausse production
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      # ⚠️ MISCONFIG : Secrets/Clés API codés en dur (Hardcoded Secrets pour déclencher Trivy/Gitleaks)
      - FLASK_SECRET_KEY=super-secret-key-12345
      - DEPLOYMENT_TOKEN=ghp_vulnerableTokenExampleFake123456789